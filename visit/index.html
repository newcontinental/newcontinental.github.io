<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>신대륙물류(주) 출입 등록</title>
<meta name="theme-color" content="#1d5e2a">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png?v=2">
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f2; overflow: hidden; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  #vs { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f5f2; }
  .top { background: #1d5e2a; color: #fff; padding: 20px 18px 16px; font-size: 19px; font-weight: 700; }
  .msg { margin: 30px 16px; background: #fff; border-radius: 14px; padding: 26px 18px; text-align: center; font-size: 15px; line-height: 1.6; border: 1px solid #e3e2dd; color: #333; }
</style>
</head>
<body>
<div id="wait"><div class="top">출입 등록</div><div class="msg" id="msg">불러오는 중...</div></div>
<script>
var GW = 'https://script.google.com/macros/s/AKfycbylymU3YkmjSNC2EFmVckdT0D9nA3D9qH-0iy9PqVgrXzt7lT38NkfcGC-4PxlsowVpwA/exec';
var KEY = 'sdr_visit_k';
function getK() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function putK(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
var h = (location.hash || '').match(/k=([A-Za-z0-9]+)/);
if (h) { putK(h[1]); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
var k = h ? h[1] : getK();
if (!k) {
  document.getElementById('msg').innerHTML = '사무실·정문에 붙어 있는 QR을<br>휴대폰 카메라로 다시 찍어 주세요.';
} else {
  var f = document.createElement('iframe');
  f.id = 'vs'; f.title = '출입 등록';
  f.src = GW + '?v=visit&k=' + encodeURIComponent(k);
  f.onload = function () { document.getElementById('wait').style.display = 'none'; };
  document.body.appendChild(f);
}
</script>
</body>
</html>
